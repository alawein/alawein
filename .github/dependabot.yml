version: 2
updates:
  # Proposes kit and action pin bumps (SHA plus version comment), grouped, after a 7-day cooldown.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 1
