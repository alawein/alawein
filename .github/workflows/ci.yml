# Profile repo SHA/profile gates. Pins are full commit SHAs of the owner's shared workflows.
# Required bare check names for the live ruleset (keep until a coordinated cutover):
#   markdown-lint, link-check, actionlint, pr-title, pr-policy
# pr-title and pr-policy live in policy.yml (owns `edited`). This file omits `edited`
# so a body edit cannot cancel lint/profile work on the same SHA.
# Canary: ci-required aggregates deterministic SHA/profile producers. Do not require
# that context in the ruleset until the owner promotes it; bare wrappers stay.
# Hold: no node-ci job (GIT-32).

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  profile-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check_profile.py
      - run: python3 -m unittest discover -s tests -q

  run-markdown-lint:
    uses: alawein/.github/.github/workflows/lint-markdown.yml@cc3b595f8e9e92a9ed6fc63b3be177cc8a571965 # quality gates

  run-link-check:
    uses: alawein/.github/.github/workflows/check-links.yml@cc3b595f8e9e92a9ed6fc63b3be177cc8a571965 # quality gates
    with:
      offline: true

  run-actionlint:
    uses: alawein/.github/.github/workflows/lint-actions.yml@cc3b595f8e9e92a9ed6fc63b3be177cc8a571965 # quality gates

  # Canary aggregator for shared SHA/profile producers. Advisory until ruleset cutover.
  # Bare fleet_base wrappers below remain the required contexts.
  ci-required:
    needs: [profile-guard, run-markdown-lint, run-link-check, run-actionlint]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require SHA and profile producers
        env:
          PROFILE: ${{ needs.profile-guard.result }}
          MARKDOWN: ${{ needs.run-markdown-lint.result }}
          LINKS: ${{ needs.run-link-check.result }}
          ACTIONS: ${{ needs.run-actionlint.result }}
        run: |
          test "$PROFILE" = "success"
          test "$MARKDOWN" = "success"
          test "$LINKS" = "success"
          test "$ACTIONS" = "success"

  # Gate jobs: a called job reports as "<caller job> / <called job>", so these carry the exact
  # check names the ruleset requires. Keep until live protection cutover to ci-required.
  markdown-lint:
    needs: [run-markdown-lint]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require success
        env:
          RESULT: ${{ needs.run-markdown-lint.result }}
        run: test "$RESULT" = "success"

  link-check:
    needs: [run-link-check]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require success
        env:
          RESULT: ${{ needs.run-link-check.result }}
        run: test "$RESULT" = "success"

  actionlint:
    needs: [run-actionlint]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require success
        env:
          RESULT: ${{ needs.run-actionlint.result }}
        run: test "$RESULT" = "success"
