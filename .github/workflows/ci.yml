# Profile repo checks. Pins are full commit SHAs of the owner's shared workflows.
# Required checks for the ruleset: pr-policy, markdown-lint, link-check, actionlint, pr-title

name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  profile-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check_profile.py
      - run: python3 -m unittest discover -s tests -q

  run-pr-policy:
    uses: alawein/.github/.github/workflows/pr-policy.yml@b5f8bc3a916b41e22e5e09ec72f34c01428c2933 # v1.3.0
    with:
      kit-ref: b5f8bc3a916b41e22e5e09ec72f34c01428c2933

  pr-policy:
    needs: [run-pr-policy]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require policy success
        env:
          RESULT: ${{ needs.run-pr-policy.result }}
        run: test "$RESULT" = "success"

  run-markdown-lint:
    uses: alawein/.github/.github/workflows/lint-markdown.yml@b5f8bc3a916b41e22e5e09ec72f34c01428c2933 # v1.3.0

  run-link-check:
    uses: alawein/.github/.github/workflows/check-links.yml@b5f8bc3a916b41e22e5e09ec72f34c01428c2933 # v1.3.0
    with:
      offline: true

  run-actionlint:
    uses: alawein/.github/.github/workflows/lint-actions.yml@b5f8bc3a916b41e22e5e09ec72f34c01428c2933 # v1.3.0

  run-pr-title:
    permissions:
      pull-requests: read
    uses: alawein/.github/.github/workflows/pr-title.yml@b5f8bc3a916b41e22e5e09ec72f34c01428c2933 # v1.3.0

  # Gate jobs: a called job reports as "<caller job> / <called job>", so these carry the exact
  # check names the ruleset requires.
  markdown-lint:
    needs: [run-markdown-lint]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require success
        env:
          RESULT: ${{ needs.run-markdown-lint.result }}
        run: test "$RESULT" = "success"

  link-check:
    needs: [run-link-check]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require success
        env:
          RESULT: ${{ needs.run-link-check.result }}
        run: test "$RESULT" = "success"

  actionlint:
    needs: [run-actionlint]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require success
        env:
          RESULT: ${{ needs.run-actionlint.result }}
        run: test "$RESULT" = "success"

  pr-title:
    needs: [run-pr-title]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      # Only the actual main-push event may omit PR-title evaluation.
      - name: Require success or eligible main-push skip
        env:
          RESULT: ${{ needs.run-pr-title.result }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          [ "$RESULT" = "success" ] || {
            [ "$RESULT" = "skipped" ] && [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]
          }
