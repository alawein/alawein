name: Claude Token Liveness

# Weekly execution probe with a trivial prompt. A failure can mean auth,
# account limits, or provider health. Diagnose the category before changing
# credentials; the output deliberately excludes private execution content.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  liveness:
    runs-on: ubuntu-latest
    steps:
      - name: Require review token
        run: |
          if [ -z "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set."
            exit 1
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: anthropics/claude-code-action@f87768c6d25f92ae6efa7175e223ef77d4cbf97f # v1.0.166
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Reply with exactly: ok. Do not use any tools.
      - name: Fail on swallowed execution error
        if: always()
        run: |
          python3 scripts/github/claude-execution-diagnostics.py \
            "$RUNNER_TEMP/claude-execution-output.json"
