name: Weekly hygiene

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: false

jobs:
  hygiene:
    uses: alawein/.github/.github/workflows/hygiene.yml@cc3b595f8e9e92a9ed6fc63b3be177cc8a571965 # quality gates
    with:
      expected-required-checks: markdown-lint,link-check,actionlint,pr-title,pr-policy
