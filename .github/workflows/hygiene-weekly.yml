name: Weekly hygiene

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: false

jobs:
  hygiene:
    uses: alawein/.github/.github/workflows/hygiene.yml@c12a7427d24940f9da589b34a7eb59a7de552d00 # quality gates
    with:
      expected-required-checks: markdown-lint,link-check,actionlint,pr-title,pr-policy
