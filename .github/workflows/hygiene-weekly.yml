name: Weekly hygiene

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: false

jobs:
  hygiene:
    uses: alawein/.github/.github/workflows/hygiene.yml@f5dbd4d7656e286e20d2aa24463253c32a56521b # v1.4.0
    with:
      expected-required-checks: markdown-lint,link-check,actionlint,pr-title,pr-policy
