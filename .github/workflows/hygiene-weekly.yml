name: Weekly hygiene

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: false

jobs:
  hygiene:
    uses: alawein/.github/.github/workflows/hygiene.yml@98c7496007ae504a3509be1c29d02afa87640aca # main (untagged), token-limited hygiene
    with:
      expected-required-checks: markdown-lint,link-check,actionlint,pr-title,pr-policy
