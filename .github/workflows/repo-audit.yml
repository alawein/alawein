name: Repository Audit

# Runs the repo-audit tests and a read-only validation scan against this
# repository. It uses only the default GITHUB_TOKEN; fields that need broader
# permissions are recorded as `unavailable` in the outputs.

on:
  push:
    paths:
      - "tools/repo-audit/**"
      - ".github/workflows/repo-audit.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Comma-separated owner/repo list to audit."
        required: false
        default: "alawein/alawein"

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run repo-audit tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest tools/repo-audit/tests -v --tb=short

      - name: Run scanner against the representative repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUDIT_TARGET: ${{ github.event.inputs.target || 'alawein/alawein' }}
        run: |
          python tools/repo-audit/scan.py \
            --repos "$AUDIT_TARGET" \
            --output-dir "$RUNNER_TEMP/repo-audit-output"

      - name: Validate CSV and JSON parity and Mermaid syntax
        run: python tools/repo-audit/scan.py --check-outputs "$RUNNER_TEMP/repo-audit-output"

      - name: Check committed examples against the recorded fixture
        env:
          # Pins the scanner clock so a fixture replay reproduces the committed
          # examples byte for byte; any other drift fails the diff below.
          SOURCE_DATE_EPOCH: "1788771600"
        run: |
          python tools/repo-audit/scan.py \
            --repos alawein/alawein \
            --fixture tools/repo-audit/tests/fixtures/alawein-alawein.json \
            --output-dir "$RUNNER_TEMP/repo-audit-fixture"
          python tools/repo-audit/scan.py --check-outputs "$RUNNER_TEMP/repo-audit-fixture"
          diff -r tools/repo-audit/examples "$RUNNER_TEMP/repo-audit-fixture"

      - name: Summarize the audit run
        if: always()
        run: |
          {
            echo "## Repository audit"
            echo
            if [ -f "$RUNNER_TEMP/repo-audit-output/backlog.md" ]; then
              sed -n '1,120p' "$RUNNER_TEMP/repo-audit-output/backlog.md"
            else
              echo "(no backlog produced)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit outputs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: repo-audit-outputs
          path: ${{ runner.temp }}/repo-audit-output
          if-no-files-found: warn
