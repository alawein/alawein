        claim: scribd is an existing fitness publishing entry.

research_clusters:
  - id: quantum-and-simulation
    members: [qmatsim, qmlab, qubeml, scicomp, simcore, spincirc]
    archive_candidates: true
    preservation_guarantees:
      - Preserve citations and bibliographic references.
      - Preserve notebooks, reproducibility materials, and datasets.
      - Preserve releases and unique research assets.
    review_required: true
  - id: physics-and-adversarial-research
    members: [edfp, loopholelab, maglogic]
    archive_candidates: true
    preservation_guarantees:
      - Preserve citations and bibliographic references.
      - Preserve notebooks, reproducibility materials, and datasets.
      - Preserve releases and unique research assets.
    review_required: true

workspace_batch:
  owning_repository: workspace-tools
  package: workspace-batch
  installation_and_auth:
    state: canary
    review_required: true
    source: https://github.com/alawein/workspace-tools/pull/27
    python: '>=3.12'
    operator_install: python -m pip install -e .
    contributor_install: python -m pip install -e ".[dev]"
    github_auth_precedence: [GITHUB_TOKEN, GH_TOKEN, gh_cli]
    note: >-
      The precedence list describes the Python resolver with its default token variable;
      a configured token variable is checked first. Direct gh commands prefer GH_TOKEN
      over GITHUB_TOKEN. Signed PR #27 retains the reviewed tree from closed PRs #25/#26.
      Keep review_required true until PR #27 is merged.

design_system:
  reference_consumers:
    - slug: repz
      compatibility: unproven
      review_required: true
      evidence:
        - source: https://github.com/alawein/repz/blob/main/tsconfig.app.json
          claim: A tsconfig alias to ./design-system/src does not prove published package compatibility.
  unsupported_claims_removed:
    - slug: scribd
      claim: shared design-system alignment
      review_required: true
