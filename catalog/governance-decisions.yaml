schema_version: 1
last_verified: '2026-09-06'
canonical_ssot:
  repository: alawein/alawein
  catalog_path: catalog/
  source: AGENTS.md
  review_required: false

roles:
  - id: knowledge-base
    role: human_retrieval_and_records
    state: established
    review_required: false
    evidence:
      - source: docs/governance/workspace-resource-map.md
        claim: Profile copy and structured records are maintained in knowledge-base.
      - source: docs/governance/profile-sync-from-guides.md
        claim: knowledge-base is the canonical source for profile copy and structured records.
  - id: workspace-tools
    role: workspace_execution
    state: established
    review_required: false
    evidence:
      - source: docs/governance/parallel-batch-execution.md
        claim: workspace-batch is the active control plane for multi-repo execution.
      - source: docs/governance/workspace-resource-map.md
        claim: Batch manifests, registry, and runtime state are canonical in workspace-tools.
  - id: incore
    role: ingestion_only
    state: proposed
    review_required: true
    transition: Confirm current ingestion implementation before assigning completed ownership; retain
      querying and inventory boundaries until that review is complete.
    evidence:
      - source: catalog/index.yaml
        claim: incore is described as tooling for asset inventory, ingest, dedupe, and querying.

acknowledgements:
  - id: workspace-control-issue-20
    subject: "workspace-control issue #20"
    state: acknowledged
    review_required: true
    source: https://github.com/alawein/workspace-control/issues/20
    note: This record acknowledges the issue without changing workspace-control or claiming resolution.

