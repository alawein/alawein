  lab:
    label: Lab
    bucket: lab
    meaning: Research, experiments, and early bets
  work:
    label: Work
    bucket: work
    meaning: Contract and employer-adjacent repositories
  archive:
    label: Archive
    bucket: archive
    meaning: Frozen repos under _archive/
