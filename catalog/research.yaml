      unimplemented.

  - id: bazel
    name: Bazel
    category: build-system
    source_url: https://bazel.build/concepts/build-files
    date_observed: "2026-09-08"
    summary: >
      Google-originated, multi-language build system for large monorepos:
      BUILD files declare targets (libraries, binaries) with explicit
      dependency edges; Bazel caches and rebuilds only what changed,
      scaling to 100k+ source files.
    scores:
      adoption_signal: 5
      maintenance_signal: 5
      security_posture: 3
      fit_to_kernel: 1
      migration_cost: 5
    kernel_impact: >
      No kernel impact: Bazel solves build/test orchestration inside one
      (typically monorepo) codebase; this kernel's problem is structural
      conformance across 46 *separate* repos, orthogonal to how any one of
      them builds internally. Recorded per step 36's starting set; no
      promotion path applies.

  - id: terraform-module-registry-structure
    name: Terraform standard module structure / registry conventions
    category: packaging-conventions
    source_url: https://developer.hashicorp.com/terraform/language/modules/develop/structure
    date_observed: "2026-09-08"
    summary: >
      HashiCorp's documented standard layout for a publishable Terraform
      module (README.md, main.tf, variables.tf, outputs.tf, examples/,
      modules/ for nested submodules) plus registry publishing rules:
      GitHub-hosted, `terraform-<PROVIDER>-<NAME>` repo naming, semantic-
      version release tags required before first publish.
    scores:
      adoption_signal: 5
      maintenance_signal: 5
      security_posture: 3
      fit_to_kernel: 4
      migration_cost: 2
    kernel_impact: >
      Directly analogous precedent for this kernel's canonical tree
      (kernel-spec.md) and ADR 0008's tagged-release pin decision: a
      registry that inspects a repo's structure to generate documentation
      and requires semver release tags before publishing is the same shape
      as this kernel expecting `.kernel-manifest.json` plus a
      `kernel-v<version>` tag before workflow_pin_sha can be set. No code
      change; this is corroborating precedent, cited in ADR 0008 revision
      if that ADR is revisited.

  - id: pre-commit-framework
    name: pre-commit framework
    category: git-hooks
    source_url: https://pre-commit.com/
    date_observed: "2026-09-08"
    summary: >
      Multi-language git-hook manager configured via
      `.pre-commit-config.yaml`, referencing versioned hook repos by git
      tag/rev; `pre-commit install` wires hooks into `.git/hooks/`, with an
      `init-templatedir` mode to auto-enable on every future `git clone`.
    scores:
      adoption_signal: 5
      maintenance_signal: 5
      security_posture: 4
      fit_to_kernel: 4
      migration_cost: 3
    kernel_impact: >
      This kernel's `.kernel/hooks/{pre-commit,commit-msg,pre-push}` +
      `workspace-batch hooks install` (Phase 4, `core.hooksPath`) reinvents
      a narrower version of what the pre-commit framework already provides
      generically (versioned hook repos, `--allow-missing-config`,
      language-agnostic hook execution). The kernel's approach is
      justified by Phase 4's own stated root-cause fix (absolute-path
      hooks breaking silently) and by not wanting a Python-only dependency
      on every repo regardless of profile; pre-commit itself requires
      Python. Worth an ADR only if hook complexity grows enough to justify
      the added Python dependency across all 46 repos -- not the case
      today.

  - id: conventional-commits
    name: Conventional Commits
    category: commit-conventions
    source_url: https://www.conventionalcommits.org/en/v1.0.0
    date_observed: "2026-09-08"
    summary: >
      Lightweight commit-message specification (`<type>[scope]:
      <description>`) that maps deterministically to SemVer bumps (feat ->
      minor, fix -> patch, BREAKING CHANGE -> major) and enables automated
      changelog generation via tools like semantic-release and
      conventional-changelog.
    scores:
      adoption_signal: 5
      maintenance_signal: 4
      security_posture: 3
      fit_to_kernel: 3
      migration_cost: 2
    kernel_impact: >
      This workspace's commit convention (docs/governance/commit-release-
      convention.md, referenced from core/alawein's AGENTS.md) already
      requires conventional-style prefixes without formally adopting the
      full spec (no automated SemVer/changelog derivation from commit
      history is wired up). The kernel's `.kernel/hooks/commit-msg`
      template (Phase 4 step 17) enforces "conventional-commit subject, no
      emoji, no em-dash, no AI-authorship trailer" -- already aligned with
      this spec's `<type>: <description>` shape. No gap to close; this
      entry documents that the existing convention already matches
      established external practice.

  - id: changesets
    name: Changesets
    category: versioning
    source_url: https://github.com/changesets/changesets
    date_observed: "2026-09-08"
    summary: >
      Monorepo-focused versioning/changelog tool: contributors add a
      `.changeset/*.md` file per PR declaring which packages changed and by
      what SemVer bump; a bot/CI step later batches pending changesets into
      one "Version Packages" PR that bumps versions and writes changelogs.
    scores:
      adoption_signal: 5
      maintenance_signal: 5
      security_posture: 3
      fit_to_kernel: 3
      migration_cost: 4
    kernel_impact: >
      Changesets' "batch pending declarations into one Version PR" pattern
      is structurally similar to this kernel's "one bump PR per wave, never
      per repo" rule (plan step 30) and to kernel-sync.yml opening one PR
      per repo per kernel_version rather than per individual managed-file
      change. Not directly adoptable: Changesets versions packages *within*
      one npm/pnpm workspace, not managed files fanned out *across* 46
      independent repos in different languages. Confirms the batching
      principle is sound external practice; no code change.

  - id: github-repository-templates
    name: GitHub repository templates ("Use this template")
    category: scaffolding
    source_url: https://docs.github.com/en/repositories/creating-and-managing-repositories/creating-a-template-repository
    date_observed: "2026-09-08"
    summary: >
      Native GitHub feature: mark a repo as a template, and "Use this
      template" (or `gh repo create --template`) creates a new repo with
      the same file tree, but explicitly does not carry over repository
      settings, labels, or branch protection -- those must be reapplied
      manually per the docs.
    scores:
      adoption_signal: 5
      maintenance_signal: 5
      security_posture: 3
      fit_to_kernel: 2
      migration_cost: 4
    kernel_impact: >
      One-shot copy at repo-creation time only, with no update mechanism --
      same limitation as cookiecutter, and the opposite of what Phase 6
      kernel-sync needs (repeated re-render of 46 *existing* repos, not
      one-time creation of new ones). Confirms this kernel targets a
      genuinely different lifecycle stage than GitHub's built-in template
      feature; the two are complementary (a NEW_REPO.md-driven initial
      creation could use a GitHub template, then kernel-sync takes over for
      ongoing conformance) but that integration is not designed or
      scheduled.

  - id: editorconfig
    name: EditorConfig
    category: formatting-conventions
    source_url: https://developer.hashicorp.com/terraform/language/modules/develop/structure
    date_observed: "2026-09-08"
    summary: >
      Editor/IDE-agnostic `.editorconfig` file declaring indent style/size,
      charset, line endings, and trailing-whitespace rules per glob
      pattern, read natively by most modern editors without a plugin.
    scores:
      adoption_signal: 5
      maintenance_signal: 4
      security_posture: 3
      fit_to_kernel: 5
      migration_cost: 1
    kernel_impact: >
      Already fully adopted: `.editorconfig` is in the canonical tree as a
      "full" kernel-managed file (render.py's _MANAGED_SPECS,
      editorconfig.tmpl) and directly related to the qmatsim CRLF
      renormalization fix (step 28a) -- that repo's `.gitattributes`
      declares `eol=lf` but 7 files' HEAD blobs are CRLF, exactly the class
      of drift a correctly-adopted `.editorconfig` + `.gitattributes` pair
      prevents going forward. No further action; this entry documents
      that the existing adoption matches the tool's intended use.

  - id: in-toto-attestations
    name: in-toto attestation framework (ITE-6)
    category: supply-chain-security
    source_url: https://github.com/in-toto/attestation/
    date_observed: "2026-09-08"
    summary: >
      Defines the authenticated, machine-readable attestation format
      (envelope + statement with subject/predicate) that SLSA provenance
      and other supply-chain claims are serialized as; the format cosign
      `attest`/`verify-attestation` and SLSA provenance both build on.
    scores:
      adoption_signal: 4
      maintenance_signal: 4
      security_posture: 4
      fit_to_kernel: 1
      migration_cost: 5
    kernel_impact: >
      No current kernel impact, same reasoning as the Sigstore/cosign
      entry: this kernel has no build step producing an attestable
      artifact yet. Recorded because it surfaced directly while verifying
      the SLSA entry (not a separately searched topic), documenting the
      full provenance-format chain (SLSA references in-toto ITE-6; cosign
      implements it) for future reference if a build/release step is ever
      added to repo-drift or the renderer itself.

  - id: semantic-release
    name: semantic-release
    category: versioning
    source_url: https://github.com/conventional-changelog/conventional-changelog
    date_observed: "2026-09-08"
    summary: >
      Fully automates version determination, changelog generation, and
      package publishing from a Conventional Commits history in CI/CD, with
      no manual version-number decision by a human.
    scores:
      adoption_signal: 5
      maintenance_signal: 5
      security_posture: 3
      fit_to_kernel: 2
      migration_cost: 3
    kernel_impact: >
      Not adopted and not a good fit: this kernel's `kernel_version` and
      `repo_drift_release_sha` bumps are deliberately manual, reviewed,
      per-wave events (ADR 0005's per-PR merge gate, ADR 0008's tagged-
      release decision) rather than an automated per-merge version bump.
      Full automation here would conflict with the standing "every PR
      needs exact yes merge #N" gate this plan enforces. Recorded as a
      considered-and-rejected pattern, not a gap.

